# Minimal live configuration for the Docker deployment.

[bot]
name = "麦麦"

[llm.profiles.planner]
base_url = "https://api.deepseek.com/v1"
api_key = "${PRETENDER_LLM_API_KEY}"
model = "deepseek-chat"

[llm.profiles.reply]
base_url = "https://api.deepseek.com/v1"
api_key = "${PRETENDER_LLM_API_KEY}"
model = "deepseek-chat"

[adapter]
name = "onebot"

[adapter.onebot]
mode = "reverse_ws"
host = "127.0.0.1"
# 3001 很容易被其他程序占用。改这里的端口后，NapCat 的连接地址要改成同一个端口。
# Port 3001 collides often. Change it here and point NapCat at the same port.
port = 3001
path = "/onebot/v11/ws"
access_token = "${ONEBOT_ACCESS_TOKEN}"

[storage]
db_path = "data/pretender.db"

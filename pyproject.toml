[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretender"
version = "1.0.1"
description = "A light MaiBot — an LLM agent that behaves like a human member of a group chat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=17",
    "numpy>=1.26",
    "pillow>=10",
    "jieba>=0.42",
    "pypinyin>=0.51",
    "orjson>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pretender = "pretender.cli:main"

[tool.setuptools.packages.find]
include = ["pretender*"]

[tool.setuptools.package-data]
pretender = ["prompts/*.txt", "schema.sql", "output/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

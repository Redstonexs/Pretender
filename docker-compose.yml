services:
  pretender:
    image: "${PRETENDER_IMAGE:?set PRETENDER_IMAGE in .env to a pinned release image}"
    labels:
      io.pretender.wizard-managed: "true"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      PRETENDER_LLM_API_KEY: "${PRETENDER_LLM_API_KEY:?set PRETENDER_LLM_API_KEY in .env}"
      ONEBOT_ACCESS_TOKEN: "${ONEBOT_ACCESS_TOKEN:?set ONEBOT_ACCESS_TOKEN in .env}"
    network_mode: host
    volumes:
      - ./config/config.toml:/config/config.toml:ro
      - pretender-data:/config/data
      # The JSONL log is also echoed to stdout, but /config/logs lives in the
      # container's writable layer and would be lost on every recreate.
      - pretender-logs:/config/logs
    command: ["run", "--live", "--config", "/config/config.toml"]

volumes:
  pretender-data:
    name: pretender-data
    external: true
  # Regenerable, so Compose-managed: unlike pretender-data there is nothing
  # here worth surviving a `compose down -v`.
  pretender-logs:
    name: pretender-logs
